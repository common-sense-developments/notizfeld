<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin:0; padding:0; background:#ffffff; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .wrap { padding: 16px; box-sizing: border-box; }
  label { display:block; font-size:13px; color:#666; margin-bottom:6px; }
  textarea {
    width:100%; min-height:180px; box-sizing:border-box;
    border:1px solid #ddd; border-radius:8px; padding:12px;
    font-size:15px; line-height:1.5; color:#222; resize:vertical;
    outline:none; background:#fafafa;
  }
  textarea:focus { border-color:#999; background:#fff; }
  .hint { margin-top:8px; font-size:12px; color:#999; }
</style>
</head>
<body>
<div class="wrap">
  <label for="notes">Deine Gedanken (nur für dich – wird nicht abgeschickt):</label>
  <textarea id="notes" placeholder="Schreib hier frei drauflos..."></textarea>
  <div class="hint">Dieser Text bleibt nur, solange diese Seite geöffnet ist.</div>
</div>
</body>
</html>
